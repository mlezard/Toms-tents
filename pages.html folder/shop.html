<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Tom's Tents</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>

    <section>
        <select name="sort" id="">
            <option value="">Sort</option>
            <option value="asending">Asending</option>
            <option value="desending">Desending</option>
        </select>

        <select name="brand" id="">
            <option value="">Brand</option>
            <option value="brand.1">Brand 1</option>
            <option value="brand.2">Brand 2</option>
            <option value="brand.3">Brand 3</option>
            <option value="brand.4">Brand 4</option>
        </select>

        <select name="categories" id="">
            <option value="">Categories</option>
            <option value="categories.1">Brand 1</option>
            <option value="categories.2">Brand 2</option>
            <option value="categories.3">Brand 3</option>
            <option value="categories.4">Brand 4</option>
        </select>

        <select name="price" id="">
            <option value="price_ranges">Price Range</option>
            <option value="price.range.1">0 - £15</option>
            <option value="categories.2">£15 - £25</option>
            <option value="categories.3">£26 - £40</option>
            <option value="categories.4">£41 - £70</option>
        </select>




    </section>
</body>
</html>
